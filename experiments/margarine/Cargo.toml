[package]
name = "margarine-lab"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["rayon", "avx512"]
rayon = ["dep:rayon"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
multirate = []
bounded = ["multirate"]
lattice = ["bounded"]
tiles = ["lattice"]
compact = ["multirate"]
compact4 = ["compact"]
reuse = ["compact"]
sparse = ["reuse"]
pooled = ["reuse"]
perceptual = ["reuse"]
physical = ["perceptual"]
refined = ["pooled"]
refined1 = ["refined"]
refined2 = ["refined"]
stratified = ["refined2"]
reference-regions = ["refined2"]

[dependencies]
butteraugli = { path = "../../butteraugli", features = ["internals"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
zenstats = { git = "https://github.com/imazen/zenmetrics", rev = "0e44a266addae8aecfb02297214a8c491cce4967", default-features = false }
archmage = "0.9.29"
magetypes = "0.9.29"
imgref = "1.12.3"
rgb = "0.8.53"
enough = "0.4.4"
rayon = { version = "1.12.0", optional = true }
zensim = { git = "https://github.com/imazen/zensim", rev = "ad18b444c27b1eb91731a18a09c272c85fc594da", default-features = false, features = ["avx512", "threads", "training", "custom-profiles"] }
zenbench = { git = "https://github.com/imazen/zenbench", rev = "1bf8a6509fce2ff4baddf1e2252639acd78d576c", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("unsafe-performance", "iir-blur", "internals"))'] }

[[bin]]
name = "margarine-score"
path = "score.rs"

[[bin]]
name = "margarine-eval"
path = "eval.rs"

[[bin]]
name = "margarine-box3"
path = "box3.rs"
