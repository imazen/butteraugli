[package]
name = "margarine-lab"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["rayon", "avx512"]
rayon = ["dep:rayon"]
avx512 = ["archmage/avx512", "magetypes/avx512"]

[dependencies]
butteraugli = { path = "../../butteraugli", features = ["internals"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
zenstats = { git = "https://github.com/imazen/zenmetrics", rev = "0e44a266addae8aecfb02297214a8c491cce4967", default-features = false }
archmage = "0.9.29"
magetypes = "0.9.29"
imgref = "1.12.3"
rgb = "0.8.53"
enough = "0.4.4"
rayon = { version = "1.12.0", optional = true }
zenbench = { version = "0.1.9", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("unsafe-performance", "iir-blur"))'] }

[[bin]]
name = "margarine-score"
path = "score.rs"

[[bin]]
name = "margarine-eval"
path = "eval.rs"

[[bin]]
name = "margarine-box3"
path = "box3.rs"
