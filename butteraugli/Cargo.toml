[package]
name = "butteraugli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/butteraugli"
readme = "../README.crates.md"
description = "Pure Rust implementation of Google's butteraugli perceptual image quality metric from libjxl"
keywords = ["image", "quality", "perceptual", "metric", "butteraugli"]
categories = ["multimedia::images", "algorithms", "graphics"]
exclude = [
    # Comparison outputs from local testing
    "comparison_outputs/",
    # Examples are local dev tools, not useful to crate consumers
    "examples/",
    # Tests are not useful to crate consumers; declarations stay in Cargo.toml for local builds
    "tests/",
]

[features]
default = ["rayon", "avx512"]
# The `linear_planes` module: a small, documented, SUPPORTED API for callers
# that already hold planar linear-light f32 image data (encoders scoring a
# reconstruction, GPU backends checking parity, batch scorers reusing one
# reference). Typed strided inputs with a stated colour space, a builder for
# reference precompute + repeated distorted scoring, explicit
# resolution/strip modes, and {max_norm, pnorm_3, optional diffmap} outputs.
# Off by default so the default surface stays exactly as published; additive
# when enabled. Scores are bit-identical to the equivalent default-API calls
# (tests/linear_planes_parity.rs).
linear-planes = []
# Expose internal modules (blur/consts/image/malta/mask/opsin/psycho) for
# testing/benchmarking. UNSTABLE — no compatibility promise, contents change
# with any internal refactor. Prefer `linear-planes`, which covers the planar
# linear-light use case with a documented contract. See CHANGELOG
# "QUEUED BREAKING CHANGES".
internals = []
# Use unchecked indexing in hot loops (Malta filters) for ~6% fewer instructions.
# Safety: each function pre-validates the full access range with an assert!().
unsafe-performance = []
# Multi-threaded parallelism via rayon. Enabled by default.
rayon = ["dep:rayon"]
# AVX-512 runtime dispatch (code paths compiled but only used if CPU supports).
avx512 = ["archmage/avx512", "magetypes/avx512"]
# Use IIR (Charalampidis) recursive Gaussian instead of FIR convolution.
# 4-10× faster on the blur (~40% of total runtime), but NOT bit-exact with the
# FIR path. Score deviation vs `butteraugli_main` reference is small but non-zero —
# unsuitable for parity-sensitive workflows. Off by default. See blur_iir.rs.
iir-blur = []
# Test-only: compile the conformance tests that need the local jpegli test
# corpus (JPEGLI_TESTDATA). Off in CI — the feature gate is the explicit,
# caller-visible skip switch (no silent runtime skipping). With the feature
# enabled, missing corpus data fails the tests loudly.
# Run locally: cargo test -p butteraugli --features corpus-tests --test conformance
corpus-tests = []
# cpp-parity feature only available locally (requires jpegli-internals-sys which is not published)
# Enable via: cargo test --features cpp-parity (after setting up local path in .cargo/config.toml)
# cpp-parity = ["dep:jpegli-internals-sys"]

[lints.rust]
# cpp-parity tests check for a feature not published to crates.io
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cpp-parity", "avx512", "rayon", "iir-blur"))'] }

[dependencies]
archmage.workspace = true
magetypes.workspace = true
imgref.workspace = true
rgb.workspace = true
rayon = { workspace = true, optional = true }
# Cooperative cancellation trait (`&dyn enough::Stop`) for the `*_with_stop`
# entry points. The crate is `std` (not `no_std`), so default features are fine.
enough = "0.4.4"

# C++ butteraugli bindings for parity testing (not on crates.io)
# For local C++ parity testing, add jpegli-internals-sys to .cargo/config.toml

[dev-dependencies]
# Image I/O for testing
png = "0.18"

# Testing utilities
approx = "0.5"

# Ergonomic cancellation tokens (`Stopper::cancelled()`) for cancellation tests
almost-enough = "0.4.4"

# Date/time for reference data generation
chrono = "0.4"

# These don't compile on wasm32 — gate them to non-wasm targets
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# JPEG encoding/decoding for roundtrip tests
mozjpeg = "0.10"
jpeg-decoder = "0.3"

# Property-based testing
proptest = "1.4"
