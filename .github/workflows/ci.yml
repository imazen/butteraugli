name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and linting - only needs to run once
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Margarine research formatting and lints
        run: |
          python3 -m unittest discover -s experiments/margarine -p 'test_*.py'
          cargo fmt --manifest-path experiments/margarine/Cargo.toml -p margarine-lab --check
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features planar --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features row-psycho --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features row-tiles,phase-rows --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features peak-stratified --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features native-gaussian --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features native-mask --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features full-malta --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features row-malta --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features wide-malta --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features simd-malta --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features simd-opsin --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/margarine/Cargo.toml --features full-malta,coarse-gaussian --all-targets -- -D warnings

      # The corpus-tests feature gates conformance tests that need the local
      # jpegli corpus (JPEGLI_TESTDATA). CI can't run them (no corpus), but
      # compiling them here keeps the gated code from rotting. Not running
      # them in CI is the explicit, caller-visible skip decision.
      - name: Compile corpus-gated tests (not run — no corpus in CI)
        run: cargo test -p butteraugli --features corpus-tests --test conformance --no-run

  # Test on multiple platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Ubuntu 24.04
          - ubuntu-22.04       # Ubuntu 22.04 LTS
          - macos-latest       # macOS ARM64 (Apple Silicon)
          - macos-26-intel     # macOS Intel x86_64
          - windows-latest     # Windows Server 2022
          - windows-11-arm     # Windows 11 ARM64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build library
        run: cargo build -p butteraugli

      - name: Build CLI
        run: cargo build -p butteraugli-cli

      - name: Run unit tests
        run: cargo test -p butteraugli --lib

      - name: Run Margarine research tests
        run: |
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features planar
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features row-psycho
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features row-tiles,phase-rows
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features peak-stratified
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features native-gaussian
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features native-mask
          cargo test --locked --manifest-path experiments/margarine/Cargo.toml --features full-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features full-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features row-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features wide-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features simd-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features simd-malta,wide-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features simd-malta,row-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features simd-opsin,row-malta
          cargo test --locked --release --manifest-path experiments/margarine/Cargo.toml --features full-malta,coarse-gaussian

      - name: Run conformance tests
        run: cargo test -p butteraugli --test conformance

      - name: Run reference parity tests
        run: cargo test -p butteraugli --test reference_parity

      - name: Run cross-arch parity tests
        run: cargo test -p butteraugli --test cross_arch_parity

      - name: Run strip parity tests
        run: cargo test -p butteraugli --test strip_parity

  # ==========================================================================
  # Non-default cargo features. The `test` matrix above only ever exercises
  # the default set, so gated code (`linear-planes`, `internals`,
  # `unsafe-performance`, `iir-blur`) rotted repeatedly — see the 0.9.3
  # iir-blur incident in CLAUDE.md. This job builds, tests and lints each
  # gated combination so a broken feature fails here instead of at a
  # consumer's build.
  # ==========================================================================
  features:
    name: Features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - linear-planes
          - internals
          - unsafe-performance
          - iir-blur
          # iir-blur x linear-planes had no coverage until 2026-08-28, and it is
          # the combination where the strip walker stops being interior-exact
          # (the halo argument needs FIR finite support). See strip.rs Parity.
          - linear-planes,iir-blur
          - linear-planes,internals,unsafe-performance
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p butteraugli --lib --tests --features ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test -p butteraugli --features ${{ matrix.features }}
      # The `Documentation` job only builds default features, so a broken
      # intra-doc link inside a gated module reaches docs.rs unnoticed.
      - name: Build documentation
        run: cargo doc -p butteraugli --no-deps --features ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings

  # The `linear-planes` surface is score-parity-critical: it must reproduce
  # the default API bit for bit. Run its parity suite on every platform the
  # main matrix covers, not just Linux.
  linear-planes-parity:
    name: linear-planes parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run linear-planes parity tests
        run: cargo test -p butteraugli --features linear-planes --test linear_planes_parity

  # ==========================================================================
  # Cross-compiled testing via QEMU
  # ==========================================================================
  test-cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
      - name: Build (cross)
        run: cross build -p butteraugli --target ${{ matrix.target }}
      - name: Test (cross/QEMU)
        run: cross test -p butteraugli --lib --target ${{ matrix.target }}
      - name: Cross-arch parity (cross/QEMU)
        run: cross test -p butteraugli --test cross_arch_parity --target ${{ matrix.target }}
      # `LinearPlanes` validates `stride * height` with checked_mul and reports
      # DimensionOverflow — a 32-bit-only path on i686/armv7. Run the parity
      # suite here so that arithmetic is exercised at 32-bit pointer width.
      - name: linear-planes parity (cross/QEMU)
        run: cross test -p butteraugli --features linear-planes --test linear_planes_parity --target ${{ matrix.target }}

      - name: Margarine research tests (cross/QEMU)
        run: |
          cross test --locked --manifest-path experiments/margarine/Cargo.toml --target ${{ matrix.target }}
          cross test --locked --manifest-path experiments/margarine/Cargo.toml --features planar --target ${{ matrix.target }}
          cross test --locked --manifest-path experiments/margarine/Cargo.toml --features row-psycho --target ${{ matrix.target }}
          cross test --locked --manifest-path experiments/margarine/Cargo.toml --features row-tiles,phase-rows --target ${{ matrix.target }}

  # ==========================================================================
  # WASM compilation check (archmage supports wasm32-simd128)
  # Dev-dependencies (mozjpeg-sys, proptest) don't compile on WASM,
  # so we verify compilation only. Unit tests run on native targets above.
  # ==========================================================================
  check-wasm:
    name: Check WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Check (wasm32-unknown-unknown, simd128)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo check --target wasm32-unknown-unknown -p butteraugli --lib
      - name: Check (wasm32-wasip1, simd128)
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo check --target wasm32-wasip1 -p butteraugli --lib
      - name: Check (wasm32-wasip1, scalar)
        run: cargo check --target wasm32-wasip1 -p butteraugli --lib

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # MSRV check disabled: image crate dependencies have broken MSRV metadata
  # (zune-jpeg 0.5.8 claims to require Rust 1.87 which doesn't exist)
  # All tests pass with current stable Rust.

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov -p butteraugli --lib --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  # Publish dry-run
  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check library packaging
        run: cargo publish -p butteraugli --dry-run

      # CLI packaging check will fail until library is published to crates.io
      # This is expected for pre-release checks
      - name: Check CLI packaging
        run: cargo publish -p butteraugli-cli --dry-run
        continue-on-error: true
