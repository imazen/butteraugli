[package]
name = "butteraugli-bench"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []

[build-dependencies]
cc = "1.4.4"

[dependencies]
# `internals` exposes blur/malta/image so benches/kernel_tiers.rs can measure
# individual kernels. The end-to-end bench cannot show a single kernel losing
# to its own scalar fallback -- the faster kernels average it away.
butteraugli = { workspace = true, features = ["internals"] }
rayon = { workspace = true }
linear-srgb = "0.6.12"
imgref = { workspace = true }
rgb = { workspace = true }
bytemuck = "1.25.2"
zenbench = "0.1.7"
# `testable_dispatch` lets benches/tier_isolation.rs disable the baseline SIMD
# token (NEON on aarch64) so the scalar arm is real rather than a second
# measurement of the SIMD path.
archmage = { version = "0.9.28", features = ["std", "testable_dispatch"] }

[[bench]]
name = "bench_compare"
harness = false

[[bench]]
name = "tier_isolation"
harness = false

[[example]]
name = "score_parity"

[[example]]
name = "strip_vs_full_mem"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(has_cpp_butteraugli)']

[[bench]]
name = "kernel_tiers"
harness = false
